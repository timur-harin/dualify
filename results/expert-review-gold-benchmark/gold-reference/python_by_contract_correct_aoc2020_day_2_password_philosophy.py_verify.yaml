profile: 'In scope: a Boolean verdict over (min_count, max_count, character, password)
  that is true exactly when the number of occurrences of the single character `character`
  in `password` lies in the inclusive interval [min_count, max_count]. Out of scope:
  input parsing, error handling for non-single-character `character`, and the exact
  counting algorithm. Observable: the returned bool.'
in_fragment: true
reference_pre:
- min_count >= 0
- max_count >= 0
- min_count <= max_count
- Length(character) == 1
reference_post: And(Implies(ret, Length(password) >= min_count), Implies(And(min_count
  > 0, Not(Contains(password, character))), Not(ret)), Implies(And(Length(password)
  == 0, min_count > 0), Not(ret)))
notes: 'ai-review: The exact specification requires counting occurrences of `character`
  in `password` and comparing against [min_count, max_count]. The Dualify fragment
  has no native "count" operator, so the postcondition is expressed as a conjunction
  of necessary (but not sufficient) implications: (a) if ret is true then password
  is at least min_count long; (b) if min_count > 0 and password does not contain character,
  ret must be false; (c) empty password with min_count > 0 forces ret false. Loosened
  min/max to >= 0 (AoC day 2 inputs are non-negative; min_count = 0 is technically
  allowed). Rewrote the draft''s "not Length(password) == 0 or not ret" (used forbidden
  Python `not`/`or`) into proper Implies form and absorbed it into (c).

  apply_reviews: agent flagged needs_attention=True.'
