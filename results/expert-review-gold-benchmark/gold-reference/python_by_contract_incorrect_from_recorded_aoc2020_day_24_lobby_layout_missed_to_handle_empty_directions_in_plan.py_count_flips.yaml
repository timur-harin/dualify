notes: 'ai-review: The original draft post `not Length(plan) == 0 or (ret == 0 and
  (not Length(plan) != 0)) or ret > 0` used Python `not`/`or`/`and` and (more importantly)
  was unsound: it forces `ret > 0` whenever `plan` is non-empty, but `count_flips`
  can legitimately return 0 when journeys cancel each other (each cell ends up white).
  Rewrote into the genuinely observable arithmetic envelope: `ret` is non-negative,
  bounded above by `Length(plan)` (each journey flips exactly one cell once, so the
  number of black cells cannot exceed the number of journeys), and is exactly 0 on
  an empty plan. Anything stronger (which cells are black) depends on the user-defined
  helpers `follow_directions` / `cell_as_tuple` and the hex-cell state map, which
  are out of fragment.

