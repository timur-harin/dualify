function_source: "def count_flips(plan: List[List[Direction]]) -> int:\n    \"\"\"\
  \n    Count how many cells had to flip for the given ``plan``.\n\n    The ``plan``\
  \ consists of different journeys, all starting from the cell zero.\n    \"\"\"\n\
  \    # True means white.\n    state = collections.defaultdict(\n        lambda:\
  \ True\n    )  # type: MutableMapping[Tuple[int, int, int], bool]\n    start = Cell(x=0,\
  \ y=0, z=0)\n    for directions in plan:\n        cell = follow_directions(start=start,\
  \ directions=directions)\n        key = cell_as_tuple(cell=cell)\n        state[key]\
  \ = not state[key]\n\n    # Count the blacks which correspond to False.\n    return\
  \ sum(1 for value in state.values() if not value)"
profile: 'In scope: arithmetic bound on the count of "black" cells produced by simulating
  a list of journeys over a hex grid. Out of scope: semantics of follow_directions
  / cell_as_tuple, the specific cells visited, and the defaultdict state. Observable:
  the returned non-negative integer count.'
