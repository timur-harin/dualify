function_source: "def list_neighbourhood(\n    i: int, j: int, height: int, width:\
  \ int\n) -> List[Tuple[int, int]]:\n    \"\"\"\n    List all the neighbours of the\
  \ given seat at position ``i, j``.\n\n    The ``height`` and ``width`` define the\
  \ limits of the layout.\n    \"\"\"\n    # (mristin, 2021-04-03): This would be\
  \ a nice use case for ensure_each.\n    start_i = max(0, i - 1)\n    end_i = min(height,\
  \ i + 2)\n    start_j = max(0, j - 1)\n    end_j = min(width, j + 2)\n\n    result\
  \ = []  # type: List[Tuple[int, int]]\n    for neighbour_i in range(start_i, end_i):\n\
  \        for neighbour_j in range(start_j, end_j):\n            if neighbour_i ==\
  \ i and neighbour_j == j:\n                continue\n\n            result.append((neighbour_i,\
  \ neighbour_j))\n\n    return result"
