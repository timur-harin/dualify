informal_spec: Compute the next departure time of the bus identified by ``bus_id``
  (which runs every ``bus_id`` minutes starting at time 0), no earlier than ``min_time``.
informal_spec_raw: Compute the next departure of ``bus_id`` leaving earliest at ``min_time``.
function_source: "def next_departure(bus_id: int, min_time: int) -> int:\n    \"\"\
  \"Compute the next departure of ``bus_id`` leaving earliest at ``min_time``.\"\"\
  \"\n    # ERROR (pschanely, 2021-04-19):\n    # bus_id and min_time should be reversed\
  \ here.\n    missed_last_bus_by = bus_id % min_time\n    if missed_last_bus_by ==\
  \ 0:\n        return min_time\n    else:\n        return min_time - missed_last_bus_by\
  \ + bus_id"
profile: 'In scope: arithmetic relation between non-negative min_time and positive
  bus_id and the smallest multiple of bus_id that is at least min_time. Out of scope:
  how the value is computed (modulo direction, branching, off-by-one bug fix). Observable:
  the returned integer departure time.'
in_fragment: true
reference_pre:
- bus_id > 0
- min_time >= 0
reference_post: And(ret >= min_time, ret < min_time + bus_id, ret % bus_id == 0)
notes: 'ai-review: Rewrote the draft postcondition into prefix And(...) form and replaced
  the spurious "(min_time != 0) or ret == 0" clause with the missing divisibility
  constraint "ret % bus_id == 0", which is what makes "next departure of bus_id" meaningful
  (buses run at multiples of bus_id starting at 0). The combination ret >= min_time,
  ret < min_time + bus_id, ret % bus_id == 0 uniquely determines the intended next
  departure. The recorded implementation is known-buggy (arguments to % are swapped),
  so this contract should disagree with the source.'
