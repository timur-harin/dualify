function_source: "def even_fibb(n: int) -> List[int]:\n    \"\"\"\n    Return a list\
  \ of the first N even fibbonacci numbers.\n\n    >>> even_fibb(2)\n    [2, 8]\n\n\
  \    pre: n >= 0\n    post: len(__return__) == n\n    \"\"\"\n    prev = 1\n   \
  \ cur = 1\n    result = []\n    while n > 0:\n        prev, cur = cur, prev + cur\n\
  \        if cur % 2 == 0:\n            result.append(cur)\n            n -= 1\n\
  \    return result"
