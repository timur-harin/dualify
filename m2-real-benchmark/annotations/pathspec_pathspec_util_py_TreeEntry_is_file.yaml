benchmark_id: pathspec::pathspec::util.py::TreeEntry::is_file
package: pathspec
stratum: boolean
signature: 'is_file(self: Any, follow_links: Optional[bool]) -> bool'
informal_spec: 'Get whether the entry is a regular file.


  *follow_links* (:class:`bool` or :data:`None`) is whether to follow symbolic

  links. If this is :data:`True`, a symlink to a regular file will result in

  :data:`True`. Default is :data:`None` for :data:`True`.


  Returns whether the entry is a regular file (:class:`bool`).'
function_source: "def is_file(self, follow_links: Optional[bool] = None) -> bool:\n\t\t\"\"\"\n\t\tGet\
  \ whether the entry is a regular file.\n\n\t\t*follow_links* (:class:`bool` or :data:`None`) is whether\
  \ to follow symbolic\n\t\tlinks. If this is :data:`True`, a symlink to a regular file will result in\n\
  \t\t:data:`True`. Default is :data:`None` for :data:`True`.\n\n\t\tReturns whether the entry is a regular\
  \ file (:class:`bool`).\n\t\t\"\"\"\n\t\tif follow_links is None:\n\t\t\tfollow_links = True\n\n\t\t\
  node_stat = self._stat if follow_links else self._lstat\n\t\treturn stat.S_ISREG(node_stat.st_mode)"
reference:
  behavior_summary: Returns True iff the entry's stat result (the linked stat when follow_links is True/None,
    otherwise the lstat) reports a regular-file mode.
  fragment_fit: out
  reference_pre: []
  reference_post: null
  profile: 'Out-of-scope: the result is stat.S_ISREG applied to a mode bit field stored in object state
    (self._stat/self._lstat); it is a function of opaque os.stat_result instance state, not of follow_links
    alone.'
  difficulty: hard
  notes: 'Out of fragment: calls stat.S_ISREG on os.stat_result.st_mode held in self._stat/self._lstat.
    follow_links=None is treated as True. Behaviour depends entirely on object state.'
