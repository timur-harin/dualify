package: packaging
stratum: numeric
signature: '_numeric_prefix_len(split: list[str]) -> int'
informal_spec: 'Count leading numeric components in a :func:`_version_split` result.


  >>> _numeric_prefix_len(["0", "1", "2", "a1"])

  3'
function_source: "def _numeric_prefix_len(split: list[str]) -> int:\n    \"\"\"Count leading numeric components\
  \ in a :func:`_version_split` result.\n\n    >>> _numeric_prefix_len([\"0\", \"1\", \"2\", \"a1\"])\n\
  \    3\n    \"\"\"\n    count = 0\n    for segment in split:\n        if not segment.isdigit():\n  \
  \          break\n        count += 1\n    return count"
