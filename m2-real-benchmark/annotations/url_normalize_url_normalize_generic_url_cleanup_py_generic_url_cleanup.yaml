function_source: "def generic_url_cleanup(url: str) -> str:\n    \"\"\"Cleanup the URL from unnecessary\
  \ data and convert to final form.\n\n    Converts shebang urls to final form, removed unnecessary data\
  \ from the url.\n\n    Params:\n        url : string : the URL\n\n    Returns:\n        string : update\
  \ url\n\n    \"\"\"\n    url = url.replace(\"#!\", \"?_escaped_fragment_=\")\n    return url.rstrip(\"\
  &? \")"
