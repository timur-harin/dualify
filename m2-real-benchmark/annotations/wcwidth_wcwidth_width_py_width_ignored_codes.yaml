benchmark_id: wcwidth::wcwidth::_width.py::_width_ignored_codes
package: wcwidth
stratum: numeric
signature: '_width_ignored_codes(text: str, ambiguous_width: int, term_program: bool | str) -> int'
informal_spec: 'Fast path for width() with control_codes=''ignore''.


  Strips escape sequences and control characters, then measures remaining text.'
function_source: "def _width_ignored_codes(text: str, ambiguous_width: int = 1,\n                    \
  \     term_program: bool | str = False) -> int:\n    \"\"\"\n    Fast path for width() with control_codes='ignore'.\n\
  \n    Strips escape sequences and control characters, then measures remaining text.\n    \"\"\"\n  \
  \  if term_program is False:\n        return wcswidth(\n            strip_sequences(text).translate(_CONTROL_CHAR_TABLE),\n\
  \            ambiguous_width=ambiguous_width,\n        )\n    return wcstwidth(\n        strip_sequences(text).translate(_CONTROL_CHAR_TABLE),\n\
  \        ambiguous_width=ambiguous_width,\n        term_program=term_program,\n    )"
reference:
