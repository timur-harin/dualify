benchmark_id: humanize::src::humanize::time.py::_rounding_by_fmt
package: humanize
stratum: numeric
signature: '_rounding_by_fmt(format: str, value: float) -> float | int'
informal_spec: 'Round a number according to the string format provided.


  The string format is the old printf-style string formatting.


  If we are using a format which truncates the value, such as "%d" or "%i", the

  returned value will be of type `int`.


  If we are using a format which rounds the value, such as "%.2f" or even "%.0f",

  we will return a float.'
function_source: "def _rounding_by_fmt(format: str, value: float) -> float | int:\n    \"\"\"Round a number\
  \ according to the string format provided.\n\n    The string format is the old printf-style string formatting.\n\
  \n    If we are using a format which truncates the value, such as \"%d\" or \"%i\", the\n    returned\
  \ value will be of type `int`.\n\n    If we are using a format which rounds the value, such as \"%.2f\"\
  \ or even \"%.0f\",\n    we will return a float.\n    \"\"\"\n    result = format % value\n\n    try:\n\
  \        value = int(result)\n    except ValueError:\n        value = float(result)\n\n    return value"
