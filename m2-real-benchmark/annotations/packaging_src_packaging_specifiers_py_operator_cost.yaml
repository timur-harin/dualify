  profile: 'Out of scope: ret depends on the operator string and on ver.endswith(''.*'') (a helper call),
    over a tuple-typed argument whose components are not directly addressable arg names in the fragment.'
  difficulty: medium
  notes: Input is a 3-tuple destructured into _, ver, op; the fragment has no tuple-indexing and the result
    branches on string equality of op plus str.endswith. Returns 0..4 for known ops, raises ValueError
    otherwise. Not expressible.
