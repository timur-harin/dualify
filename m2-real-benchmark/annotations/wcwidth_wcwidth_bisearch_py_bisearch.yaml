  difficulty: medium
  notes: 'Out reason: the exact result is ''exists a row i with table[i][0] <= ucs <= table[i][1]'', a
    quantifier over the table argument (a tuple of pairs not addressable in the fragment). Near approximation
    keeps only the codomain fact ret in {0,1}; the membership semantics are not faithfully expressible.'
