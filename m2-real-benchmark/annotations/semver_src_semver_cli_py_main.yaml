  \    :return: error code\n    \"\"\"\n    try:\n        parser = createparser()\n        args = parser.parse_args(args=cliargs)\n\
  \        # Save parser instance:\n        args.parser = parser\n        result = process(args)\n   \
  \     if result is not None:\n            print(result)\n        return 0\n\n    except (ValueError,\
  \ TypeError) as err:\n        print(\"ERROR\", err, file=sys.stderr)\n        return 2"
