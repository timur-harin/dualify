signature: 'evaluate(self: Any, environment: Mapping[str, str | AbstractSet[str]] | None, context: EvaluateContext)
  -> bool'
informal_spec: "Evaluate a marker.\n\nReturn the boolean from evaluating this marker against the environment.\n\
  The environment is determined from the current Python process unless\npassed in explicitly.\n\n:param\
  \ environment: Mapping containing keys and values to override the\n   detected environment.\n:param\
  \ EvaluateContext context: The context in which the marker is\n    evaluated, which influences what\
  \ marker names are considered valid.\n    Accepted values are ``\"metadata\"`` (for core metadata; default),\n\
  \    ``\"lock_file\"``, and ``\"requirement\"`` (i.e. all other situations).\n:raises UndefinedComparison:\
  \ If the marker uses a comparison on values\n    that are not valid versions per the :ref:`specification\
  \ of version\n    specifiers <pypug:version-specifiers>`.\n:raises UndefinedEnvironmentName: If the\
  \ marker references a value that\n    is missing from the evaluation environment.\n:returns: ``True``\
  \ if the marker matches, otherwise ``False``."
function_source: "def evaluate(\n        self,\n        environment: Mapping[str, str | AbstractSet[str]]\
  \ | None = None,\n        context: EvaluateContext = \"metadata\",\n    ) -> bool:\n        \"\"\"Evaluate\
  \ a marker.\n\n        Return the boolean from evaluating this marker against the environment.\n   \
  \     The environment is determined from the current Python process unless\n        passed in explicitly.\n\
  \n        :param environment: Mapping containing keys and values to override the\n           detected\
  \ environment.\n        :param EvaluateContext context: The context in which the marker is\n       \
  \     evaluated, which influences what marker names are considered valid.\n            Accepted values\
  \ are ``\"metadata\"`` (for core metadata; default),\n            ``\"lock_file\"``, and ``\"requirement\"\
  `` (i.e. all other situations).\n        :raises UndefinedComparison: If the marker uses a comparison\
  \ on values\n            that are not valid versions per the :ref:`specification of version\n      \
  \      specifiers <pypug:version-specifiers>`.\n        :raises UndefinedEnvironmentName: If the marker\
  \ references a value that\n            is missing from the evaluation environment.\n        :returns:\
  \ ``True`` if the marker matches, otherwise ``False``.\n\n        \"\"\"\n        current_environment\
  \ = cast(\n            \"dict[str, str | AbstractSet[str]]\", default_environment()\n        )\n   \
  \     if context == \"lock_file\":\n            current_environment.update(\n                extras=frozenset(),\
  \ dependency_groups=frozenset()\n            )\n        elif context == \"metadata\":\n            current_environment[\"\
  extra\"] = \"\"\n\n        if environment is not None:\n            current_environment.update(environment)\n\
  \            if \"extra\" in current_environment:\n                # The API used to allow setting extra\
  \ to None. We need to handle\n                # this case for backwards compatibility. Also skip running\n\
  \                # normalize name if extra is empty.\n                extra = cast(\"str | None\", current_environment[\"\
  extra\"])\n                current_environment[\"extra\"] = canonicalize_name(extra) if extra else \"\
  \"\n\n        return _evaluate_markers(\n            self._markers, _repair_python_full_version(current_environment)\n\
  \        )"
