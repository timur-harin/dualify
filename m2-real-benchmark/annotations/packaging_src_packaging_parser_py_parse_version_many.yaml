function_source: "def _parse_version_many(tokenizer: Tokenizer) -> str:\n    \"\"\"\n    version_many\
  \ = (SPECIFIER (WS? COMMA WS? SPECIFIER)*)?\n    \"\"\"\n    parsed_specifiers = \"\"\n    while tokenizer.check(\"\
  SPECIFIER\"):\n        span_start = tokenizer.position\n        parsed_specifiers += tokenizer.read().text\n\
  \        if tokenizer.check(\"VERSION_PREFIX_TRAIL\", peek=True):\n            tokenizer.raise_syntax_error(\n\
  \                \".* suffix can only be used with `==` or `!=` operators\",\n                span_start=span_start,\n\
  \                span_end=tokenizer.position + 1,\n            )\n        if tokenizer.check(\"VERSION_LOCAL_LABEL_TRAIL\"\
  , peek=True):\n            tokenizer.raise_syntax_error(\n                \"Local version label can\
  \ only be used with `==` or `!=` operators\",\n                span_start=span_start,\n            \
  \    span_end=tokenizer.position,\n            )\n        tokenizer.consume(\"WS\")\n        if not\
  \ tokenizer.check(\"COMMA\"):\n            break\n        parsed_specifiers += tokenizer.read().text\n\
  \        tokenizer.consume(\"WS\")\n\n    return parsed_specifiers"
