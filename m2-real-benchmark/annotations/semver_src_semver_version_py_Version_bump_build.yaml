informal_spec: "Raise the build part of the version, return a new object but leave self\nuntouched.\n\n\
  :param token: defaults to ``'build'``\n:return: new :class:`Version` object with the raised build part.\n\
  \    The original object is not modified.\n\n>>> ver = semver.parse(\"3.4.5-rc.1+build.9\")\n>>> ver.bump_build()\n\
  Version(major=3, minor=4, patch=5, prerelease='rc.1', build='build.10')"
function_source: "def bump_build(self, token: Optional[str] = \"build\") -> \"Version\":\n        \"\"\
  \"\n        Raise the build part of the version, return a new object but leave self\n        untouched.\n\
  \n        :param token: defaults to ``'build'``\n        :return: new :class:`Version` object with the\
  \ raised build part.\n            The original object is not modified.\n\n        >>> ver = semver.parse(\"\
  3.4.5-rc.1+build.9\")\n        >>> ver.bump_build()\n        Version(major=3, minor=4, patch=5, prerelease='rc.1',\
  \ \\\nbuild='build.10')\n        \"\"\"\n        cls = type(self)\n        if self._build is not None:\n\
  \            build = self._build\n        elif token == \"\":\n            build = \"0\"\n        elif\
  \ token is None:\n            build = \"build.0\"\n        else:\n            build = str(token) + \"\
  .0\"\n\n        # self._build or (token or \"build\") + \".0\"\n        build = cls._increment_string(build)\n\
  \        if self._build is not None:\n            build = self._build\n        elif token == \"\":\n\
  \            build = \"0\"\n        elif token is None:\n            build = \"build.0\"\n        else:\n\
  \            build = str(token) + \".0\"\n\n        # self._build or (token or \"build\") + \".0\"\n\
  \        build = cls._increment_string(build)\n        return cls(self._major, self._minor, self._patch,\
  \ self._prerelease, build)"
