  difficulty: hard
  notes: 'Out of fragment: calls helper _get_glibc_version(), dynamic import, hasattr/attribute lookups,
    and external callbacks manylinux_compatible/manylinuxN_compatible. Behaviour depends on environment
    and on the opaque _GLibCVersion tuple, not just on arch/version.'
