function_source: "def find_pair_with_sum(items: List[int], total: int) -> Optional[Tuple[int,\
  \ int]]:\n    \"\"\"Find the two entries that sum to ``total``.\"\"\"\n    for i,\
  \ x in enumerate(items):\n        for y in items[i + 1 :]:\n            if x + y\
  \ == total:\n                return (x, y)\n    return None"
