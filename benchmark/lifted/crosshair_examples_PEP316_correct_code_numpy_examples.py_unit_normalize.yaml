notes: 'ai-review: Dropped the `a.dtype == np.float64` precondition because the fragment
  has no notion of numpy dtype identity; the signature annotation already declares
  `np.ndarray`. Rewrote `np.ptp(a) > 0` (max - min > 0) as an Exists/Exists witness
  that two elements differ, which is equivalent for finite arrays. Rewrote the original
  max/min postconditions as a universal element-wise bound and added the length-preservation
  conjunct that the implementation `(a - min(a)) / ptp(a)` clearly satisfies. The
  exact value of `(a[i] - min(a)) / (max(a) - min(a))` is not pinned down element-by-element
  because min/max are not in the fragment.

  apply_reviews: agent flagged needs_attention=True.'
