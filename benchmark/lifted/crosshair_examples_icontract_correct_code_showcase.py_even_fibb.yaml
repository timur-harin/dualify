informal_spec_raw: 'Return a list of the first N even fibbonacci numbers.


  >>> even_fibb(2)

  [2, 8]'
function_source: "def even_fibb(n: int) -> List[int]:\n    \"\"\"\n    Return a list\
  \ of the first N even fibbonacci numbers.\n\n    >>> even_fibb(2)\n    [2, 8]\n\
  \    \"\"\"\n    prev = 1\n    cur = 1\n    result = []\n    while n > 0:\n    \
  \    prev, cur = cur, prev + cur\n        if cur % 2 == 0:\n            result.append(cur)\n\
  \            n -= 1\n    return result"
profile: 'In scope: arithmetic-shape contract that a non-negative integer N maps to
  a length-N list of strictly increasing positive even integers (the first N even
  Fibonacci numbers). Out of scope: the actual Fibonacci recurrence linking consecutive
  returned values (e.g. ret[1] == 8, ret[2] == 34). Observable: the returned list
  (length, parity of entries, ordering, first entry when N>=1).'
