function_source: "def count_trees(width: int, height: int, input_string: str) -> int:\n\
  \    \"\"\"Count the trees in the ``input_string``.\"\"\"\n    count: int = 0\n\
  \    current_x: int = 0\n    current_y: int = 0\n\n    while current_y < height:\n\
  \        if input_string[current_y * width + current_x] == \"#\":\n            count\
  \ += 1\n        current_x = (current_x + STEP_SIZE_HORIZONTAL) % width\n       \
  \ current_y += STEP_SIZE_VERTICAL\n\n    return count"
profile: 'In scope: counting ''#'' characters along a fixed-slope toboggan path through
  a width-by-height grid encoded as a flat string. Out of scope: the exact slope (governed
  by module-level STEP_SIZE_* constants not in the signature) and any wrapping semantics
  beyond the count bound. Observable: the returned non-negative integer count, bounded
  by the number of rows traversed.'
