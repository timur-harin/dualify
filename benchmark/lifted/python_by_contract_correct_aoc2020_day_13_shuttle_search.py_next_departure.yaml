  \"Compute the next departure of ``bus_id`` leaving earliest at ``min_time``.\"\"\
  \"\n    missed_last_bus_by = min_time % bus_id\n    if missed_last_bus_by == 0:\n\
  \        return min_time\n    else:\n        return min_time - missed_last_bus_by\
  \ + bus_id"
