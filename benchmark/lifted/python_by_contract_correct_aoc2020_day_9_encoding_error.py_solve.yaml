- Length(puzzle_input) > preamble_length
- preamble_length > 0
reference_post: Or(And(ret == None, ForAll([k], Implies(And(preamble_length <= k,
  k < Length(puzzle_input)), Exists([i], And(0 <= i, i < preamble_length, Exists([j],
  And(0 <= j, j < preamble_length, i != j, puzzle_input[k - preamble_length + i] +
  puzzle_input[k - preamble_length + j] == puzzle_input[k])))))))), And(Not(ret ==
  None), preamble_length <= ret[0], ret[0] < Length(puzzle_input), ret[1] == puzzle_input[ret[0]],
  Not(Exists([i], And(0 <= i, i < preamble_length, Exists([j], And(0 <= j, j < preamble_length,
  i != j, puzzle_input[ret[0] - preamble_length + i] + puzzle_input[ret[0] - preamble_length
  + j] == ret[1]))))), ForAll([k], Implies(And(preamble_length <= k, k < ret[0]),
