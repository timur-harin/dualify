informal_spec: "Parse the data of the XMAS protocol, ``puzzle_input``, and find a\
  \ weakness.\n\n:return:\n    offset of the number,\n    first number *after* the\
  \ preamble which uncovers the weakness"
informal_spec_raw: "Parse the data of the XMAS protocol, ``puzzle_input``, and find\
  \ a weakness.\n\n:return:\n    offset of the number,\n    first number *after* the\
  \ preamble which uncovers the weakness"
function_source: "def solve(puzzle_input: List[int], preamble_length: int) -> Optional[Tuple[int,\
  \ int]]:\n    \"\"\"\n    Parse the data of the XMAS protocol, ``puzzle_input``,\
  \ and find a weakness.\n\n    :return:\n        offset of the number,\n        first\
  \ number *after* the preamble which uncovers the weakness\n    \"\"\"\n    for index,\
  \ number in enumerate(puzzle_input[preamble_length:]):\n        preamble = puzzle_input[index\
  \ : index + preamble_length]\n        valid = False\n        for i in preamble:\n\
  \            for j in preamble:\n                if i != j and i + j == number:\n\
  \                    valid = True\n        if not valid:\n            return preamble_length\
  \ + index, number\n\n    return None"
profile: 'In scope: arithmetic relation between a non-empty integer list with a preamble
  length and the optional (offset, value) pair identifying the first post-preamble
  entry that is not the sum of two distinct values in its immediately preceding preamble
  window. Out of scope: iteration order, intermediate variables, behaviour when the
  input list is shorter than the preamble. Observable: whether ret is None vs a 2-tuple,
  and the offset/value it carries.'
in_fragment: true
