notes: 'ai-review: Rewrote draft post `min(numbers) <= ret <= max(numbers)` into the
  fragment using Exists quantifiers: `min(numbers) <= ret` iff some element is <=
  ret (since the min is itself in the list), and symmetrically for the upper bound.
  This is logically equivalent given the precondition that numbers is non-empty. Did
  not strengthen to the exact arithmetic mean because that would require summing the
  list, which is not directly expressible without an additional helper.'
