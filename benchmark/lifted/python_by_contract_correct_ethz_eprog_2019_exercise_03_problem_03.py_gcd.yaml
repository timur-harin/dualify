notes: 'ai-review: Draft used `math_gcd(x, y)`, which is a user-defined helper call
  and not in the Dualify fragment. The postcondition expresses the common-divisor
  part of GCD (ret > 0 and ret divides both x and y). The maximality clause ("ret
  is the greatest such divisor") needs an unbounded ForAll over the integers and is
  therefore out of fragment.

