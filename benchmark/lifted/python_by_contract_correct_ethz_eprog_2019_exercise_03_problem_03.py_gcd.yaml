function_source: "def gcd(x: int, y: int) -> int:\n    \"\"\"Compute the greatest\
  \ common divisor (GCD) between ``x`` and ``y``.\"\"\"\n    if x >= y and x % y ==\
  \ 0:\n        return y\n\n    return gcd(y, x % y)"
