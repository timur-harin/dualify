informal_spec_raw: Apply the ``directive`` given the range as ``[first, last]`` (inclusive).
function_source: "def apply(first: int, last: int, directive: str) -> Tuple[int, int]:\n\
  \    \"\"\"\n    Apply the ``directive`` given the range as ``[first, last]``\
  \ (inclusive).\n\n    :return: new first, new last\n    \"\"\"\n    half = int((last\
  \ - first + 1) / 2)\n\n    if directive in \"FL\":\n        return first, last -\
  \ half\n\n    elif directive in \"BR\":\n        return first + half, last\n\n \
  \   else:\n        raise NotImplementedError(directive)"
profile: 'In scope: one binary-search partition step on an inclusive integer range
  for directives F/L (lower half) or B/R (upper half). Out of scope: invalid directives,
  string boarding-pass decoding. Observable: returned (first, last) tuple.'
